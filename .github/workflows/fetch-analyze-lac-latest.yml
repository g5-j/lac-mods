name: Extract LAC native libraries and metadata
run-name: Extract libil2cpp and global-metadata

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-analyze-lac-latest.yml"

permissions:
  contents: read

concurrency:
  group: lac-xapk-binary-extraction
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download the original XAPK
        shell: bash
        run: |
          set -euo pipefail
          URL='https://d.apkpure.com/b/XAPK/com.MA.LAC?version=latest'
          mkdir -p work/xapk work/apks artifact/extracted/native artifact/extracted/metadata
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36' \
            "$URL" --output work/LAC-latest.xapk
          test -s work/LAC-latest.xapk
          unzip -t work/LAC-latest.xapk
          unzip -q work/LAC-latest.xapk -d work/xapk

      - name: Extract the two requested files from APK contents
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' APK_FILES < <(find work/xapk -type f -iname '*.apk' -print0)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "No APK files were found inside the XAPK." >&2
            exit 1
          fi

          for index in "${!APK_FILES[@]}"; do
            apk="${APK_FILES[$index]}"
            destination="work/apks/$index"
            mkdir -p "$destination"
            unzip -q "$apk" -d "$destination"
          done

          mapfile -d '' LIB_FILES < <(find work/apks -type f -name 'libil2cpp.so' -print0)
          mapfile -d '' META_FILES < <(find work/apks -type f -name 'global-metadata.dat' -print0)

          if [ "${#LIB_FILES[@]}" -eq 0 ]; then
            echo "libil2cpp.so was not found in the APK files." >&2
            exit 1
          fi
          if [ "${#META_FILES[@]}" -eq 0 ]; then
            echo "global-metadata.dat was not found in the APK files." >&2
            exit 1
          fi

          # Keep each ABI-specific native library and the metadata file's original APK-relative path.
          for source in "${LIB_FILES[@]}"; do
            relative="${source#work/apks/}"
            abi="$(basename "$(dirname "$source")")"
            mkdir -p "artifact/extracted/native/$abi"
            cp "$source" "artifact/extracted/native/$abi/libil2cpp.so"
            printf '%s\n' "$relative" >> artifact/extracted/native/source-paths.txt
          done

          # Usually there is one metadata file. Preserve distinct copies if split APKs contain more than one.
          for index in "${!META_FILES[@]}"; do
            source="${META_FILES[$index]}"
            if [ "$index" -eq 0 ]; then
              cp "$source" artifact/extracted/metadata/global-metadata.dat
            else
              cp "$source" "artifact/extracted/metadata/global-metadata-$index.dat"
            fi
            printf '%s\n' "${source#work/apks/}" >> artifact/extracted/metadata/source-paths.txt
          done

          echo "Extracted native libraries:"
          find artifact/extracted/native -type f -printf '%P (%s bytes)\n' | sort
          echo "Extracted metadata:"
          find artifact/extracted/metadata -type f -printf '%P (%s bytes)\n' | sort
          test -s artifact/extracted/metadata/global-metadata.dat

      - name: Upload the extracted files
        uses: actions/upload-artifact@v4
        with:
          name: LAC-libil2cpp-and-global-metadata
          path: artifact/extracted/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
