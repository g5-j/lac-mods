name: Fetch and inspect latest LAC XAPK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-analyze-lac-latest.yml"

permissions:
  contents: write

concurrency:
  group: lac-latest-inspection
  cancel-in-progress: true

jobs:
  fetch-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip p7zip-full file binutils
          python -m pip install --upgrade pip
          python -m pip install UnityPy
          mkdir -p work/xapk work/unpacked work/obb-unpacked artifact/report artifact/text-assets

      - name: Download latest XAPK from APKPure
        shell: bash
        run: |
          set -euo pipefail
          URL='https://d.apkpure.com/b/XAPK/com.MA.LAC?version=latest'
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36' \
            "$URL" --output work/LAC-latest.xapk
          test -s work/LAC-latest.xapk
          file work/LAC-latest.xapk | tee artifact/report/download-file-type.txt
          sha256sum work/LAC-latest.xapk | tee artifact/report/xapk-sha256.txt
          unzip -t work/LAC-latest.xapk

      - name: Extract XAPK and identify package version and OBB
        shell: bash
        run: |
          set -euo pipefail
          unzip -q work/LAC-latest.xapk -d work/unpacked
          find work/unpacked -type f -printf '%P\t%s bytes\n' | sort > artifact/report/xapk-file-list.txt
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("work/unpacked")
          candidates=list(root.rglob("manifest.json"))
          out={"package":"com.MA.LAC","manifest_found":bool(candidates)}
          if candidates:
              try:
                  data=json.loads(candidates[0].read_text(errors="replace"))
                  out["xapk_manifest"]=data
                  out["version_code"]=data.get("version_code") or data.get("versionCode")
                  out["version_name"]=data.get("version_name") or data.get("versionName")
              except Exception as e: out["manifest_parse_error"]=str(e)
          obbs=[str(p) for p in root.rglob("*.obb")]
          apks=[str(p) for p in root.rglob("*.apk")]
          out["apk_files"]=apks
          out["obb_files"]=obbs
          pathlib.Path("artifact/report/package-summary.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          cp work/LAC-latest.xapk artifact/LAC-latest.xapk
          find work/unpacked -type f -iname '*.obb' -exec cp --parents {} artifact/ \;

      - name: Extract and inventory OBB contents
        shell: bash
        run: |
          set -euo pipefail
          : > artifact/report/obb-file-list.txt
          while IFS= read -r -d '' obb; do
            rel="${obb#work/unpacked/}"
            out="work/obb-unpacked/${rel//\//_}"
            mkdir -p "$out"
            if unzip -t "$obb" >/dev/null 2>&1; then
              unzip -q "$obb" -d "$out"
              find "$out" -type f -printf '%f\n' | awk -F. '{ext=tolower($NF); if (NF==1) ext="[no extension]"; count[ext]++} END {for (e in count) print "${rel}: " e " files=" count[e]}' >> artifact/report/obb-file-list.txt
            else
              echo "$rel is not a ZIP-compatible OBB; raw file retained for scanning" >> artifact/report/obb-file-list.txt
              cp "$obb" "$out/obb.bin"
            fi
          done < <(find work/unpacked -type f -iname '*.obb' -print0)
          sort -o artifact/report/obb-file-list.txt artifact/report/obb-file-list.txt
          if [ ! -s artifact/report/obb-file-list.txt ]; then
            echo "No .obb file was present in the downloaded XAPK." > artifact/report/obb-file-list.txt
          fi

      - name: Extract Unity TextAssets and scan readable strings
        shell: bash
        run: |
          set -euo pipefail
          cat > work/extract_unity_text.py <<'PY'
          import pathlib, json, traceback, re
          import UnityPy
          roots=[pathlib.Path("work/unpacked"),pathlib.Path("work/obb-unpacked")]
          rows=[]
          out=pathlib.Path("artifact/text-assets"); out.mkdir(parents=True,exist_ok=True)
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob("*"):
                  if not p.is_file(): continue
                  try:
                      env=UnityPy.load(str(p))
                      for i,obj in enumerate(env.objects):
                          typ=obj.type.name
                          if typ != "TextAsset": continue
                          try: data=obj.read()
                          except Exception: continue
                          name=getattr(data,"m_Name",None) or f"{typ}_{i}"
                          if typ=="TextAsset":
                              payload=getattr(data,"m_Script",b"")
                              if isinstance(payload,str): raw=payload.encode("utf-8","replace")
                              else: raw=bytes(payload)
                              decoded=raw.decode("utf-8","replace")
                              ui_re=re.compile(r"(?i)\\b(menu|settings|language|localization|translation|chat|message|hud|editor|graphics|audio|controls|loading|save|login|account|network|connection|multiplayer|map|help|tutorial|server|display|quality|sound|music|button|input)\\b|[ء-ي]")
                              excluded_re=re.compile(r"(?i)\\b(weapon|weapons|gun|guns|firearm|ammo|ammunition|rifle|pistol|shotgun|sniper|grenade|knife|sword|bullet|launcher|rocket|crossbow|bow|melee|explosive)\\b")
                              if excluded_re.search(str(name)) or excluded_re.search(str(p)): continue
                              if not ui_re.search(str(name)): continue
                              safe_lines=[line for line in decoded.splitlines() if ui_re.search(line) and not excluded_re.search(line)]
                              if not safe_lines: continue
                              safe="".join(c if c.isalnum() or c in "._-" else "_" for c in str(name))[:100]
                              dest=out/f"{p.name}_{safe}_{i}.txt"
                              dest.write_text("\\n".join(safe_lines)+"\\n",encoding="utf-8")
                              rows.append({"source":str(p),"type":typ,"name":str(name),"output":str(dest),"matched_ui_lines":len(safe_lines)})
                          else:
                              continue
                  except Exception:
                      continue
          pathlib.Path("artifact/report/unity-object-index.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print(f"Indexed {len(rows)} Unity TextAsset/MonoBehaviour objects")
          PY
          python work/extract_unity_text.py
          : > artifact/report/ui-localization-hits.txt
          while IFS= read -r -d '' f; do
            case "$f" in *.xapk) continue;; esac
            {
              strings -a -n 4 "$f" 2>/dev/null | sed "s#^#ASCII $f: #" || true
              strings -el -n 4 "$f" 2>/dev/null | sed "s#^#UTF16LE $f: #" || true
            } | grep -Eai '(^|[^[:alpha:]])(menu|settings|language|localization|translation|chat|message|hud|editor|graphics|audio|controls|loading|save|login|account|network|connection|multiplayer|map|help|tutorial|server|display|quality|sound|music|button|input)([^[:alpha:]]|$)|[ء-ي]' \
              | grep -Eiv '(weapon|weapons|gun|guns|firearm|ammo|ammunition|rifle|pistol|shotgun|sniper|grenade|knife|sword|bullet|launcher|rocket|crossbow|melee|explosive)' \
              >> artifact/report/ui-localization-hits.txt || true
          done < <(find work/unpacked work/obb-unpacked -type f -print0)
          find artifact/text-assets -type f -printf '%P\t%s bytes\n' | sort > artifact/report/extracted-textasset-list.txt

      - name: Build inspection summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# LAC latest package inspection"
            echo
            echo "- Package: com.MA.LAC"
            echo "- Source: APKPure latest XAPK endpoint"
            echo "- Inspected at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## XAPK files"
            cat artifact/report/xapk-file-list.txt
            echo
            echo "## OBB contents"
            cat artifact/report/obb-file-list.txt
            echo
            echo "## Unity TextAssets"
            cat artifact/report/extracted-textasset-list.txt
            echo
            echo "## Likely localization/text matches"
            echo "See ui-localization-hits.txt (weapon-related terms excluded)."
          } > artifact/report/README.md

      - name: Upload package and analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LAC-latest-XAPK-full-inspection
          path: |
            artifact/LAC-latest.xapk
            artifact/*.obb
            artifact/report/
            artifact/text-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Commit text-only inspection results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/latest
          cp -a artifact/report/. analysis/latest/
          cp -a artifact/text-assets/. analysis/latest/text-assets/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/latest
          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
          else
            git commit -m "Analyze latest LAC XAPK and OBB text assets"
            git push
          fi
