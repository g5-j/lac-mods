name: Build LAC 1.9.8 floating overlay APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-lac-198-overlay.yml"

permissions:
  contents: read

concurrency:
  group: lac-198-overlay-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools
        uses: android-actions/setup-android@v3
      - name: Install apktool and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool zip unzip
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Download and validate LAC 1.9.8 source APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 \
            --user-agent 'Mozilla/5.0' \
            'https://d.apkpure.com/b/XAPK/com.MA.LAC?version=latest' \
            -o work/source.xapk
          unzip -q work/source.xapk -d work/xapk
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path("work/xapk")
          ms=list(root.rglob("manifest.json"))
          if not ms: raise SystemExit("XAPK manifest missing")
          m=json.loads(ms[0].read_text(errors="replace"))
          version=str(m.get("version_name") or m.get("versionName") or "")
          code=str(m.get("version_code") or m.get("versionCode") or "")
          if (version,code)!=("1.9.8","62"):
              raise SystemExit(f"Wrong source version: {version} ({code}); expected 1.9.8 (62)")
          apks=list(root.rglob("*.apk"))
          if len(apks)!=1: raise SystemExit(f"Expected one base APK, got {len(apks)}")
          shutil.copy2(apks[0],"work/original.apk")
          PY
          unzip -tq work/original.apk

      - name: Decode APK and inject in-app floating menu
        shell: bash
        run: |
          set -euo pipefail
          apktool d -f work/original.apk -o work/decoded
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path("work/decoded/AndroidManifest.xml")
          tree=ET.parse(p); root=tree.getroot()
          ns="{http://schemas.android.com/apk/res/android}"
          app=root.find("application")
          if app is None: raise SystemExit("Manifest application node missing")
          old=app.get(ns+"name")
          if old and old not in ("android.app.Application",""):
              raise SystemExit("Existing custom Application detected; refusing unsafe replacement: "+old)
          app.set(ns+"name","com.lac.overlay.LacOverlayApplication")
          ET.register_namespace("android","http://schemas.android.com/apk/res/android")
          tree.write(p,encoding="utf-8",xml_declaration=True)
          PY
          mkdir -p work/java/com/lac/overlay
          cat > work/java/com/lac/overlay/LacOverlayApplication.java <<'JAVA'
          package com.lac.overlay;

          import android.app.Activity;
          import android.app.Application;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.content.Context;
          import android.content.SharedPreferences;

          public final class LacOverlayApplication extends Application implements Application.ActivityLifecycleCallbacks {
              @Override public void onCreate() {
                  super.onCreate();
                  registerActivityLifecycleCallbacks(this);
              }
              @Override public void onActivityResumed(Activity a) {
                  if (!"com.MA.LAC".equals(a.getPackageName())) return;
                  View old=a.getWindow().getDecorView().findViewWithTag("lac_local_overlay");
                  if(old!=null) return;
                  FrameLayout decor=(FrameLayout)a.getWindow().getDecorView();
                  Overlay v=new Overlay(a);
                  v.setTag("lac_local_overlay");
                  decor.addView(v,new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.MATCH_PARENT));
              }
              @Override public void onActivityPaused(Activity a) {}
              @Override public void onActivityCreated(Activity a, Bundle b) {}
              @Override public void onActivityStarted(Activity a) {}
              @Override public void onActivityStopped(Activity a) {}
              @Override public void onActivitySaveInstanceState(Activity a, Bundle b) {}
              @Override public void onActivityDestroyed(Activity a) {}

              static final class Overlay extends View {
                  final Paint p=new Paint(3);
                  final SharedPreferences prefs;
                  int kills;
                  float bx=34,by=0,downX,downY,startX,startY;
                  boolean menu=false,drag=false;
                  float density;
                  Overlay(Context c) {
                      super(c);
                      density=getResources().getDisplayMetrics().density;
                      prefs=c.getSharedPreferences("lac_local_overlay",0);
                      kills=prefs.getInt("local_kill_display",0);
                      setLayerType(View.LAYER_TYPE_SOFTWARE,null);
                  }
                  float d(float n){return n*density;}
                  void rounded(Canvas c,float l,float t,float r,float b,float rad,int color){
                      p.setColor(color); p.setStyle(Paint.Style.FILL);
                      c.drawRoundRect(new RectF(l,t,r,b),rad,rad,p);
                  }
                  void text(Canvas c,String s,float x,float y,float size,int color,boolean bold){
                      p.setColor(color);p.setTextSize(d(size));
                      p.setTypeface(bold?Typeface.create("sans-serif",Typeface.BOLD):Typeface.create("sans-serif",Typeface.NORMAL));
                      c.drawText(s,x,y,p);
                  }
                  @Override protected void onDraw(Canvas c){
                      super.onDraw(c);
                      if(by==0) by=getHeight()*0.62f;
                      float x=d(bx), y=by;
                      rounded(c,x,y,x+d(112),y+d(42),d(14),0xEE101820);
                      rounded(c,x+d(3),y+d(3),x+d(109),y+d(39),d(11),0xFF172B3A);
                      text(c,"LAC  •  MENU",x+d(12),y+d(26),12,0xFFFFFFFF,true);
                      if(!menu)return;
                      float top=y+d(52);
                      rounded(c,x,top,x+d(224),top+d(166),d(14),0xF20B1118);
                      rounded(c,x+d(1),top+d(1),x+d(223),top+d(165),d(13),0xFF17232E);
                      text(c,"LOCAL DISPLAY",x+d(14),top+d(25),11,0xFF69C8F4,true);
                      text(c,"Kill counter (device only)",x+d(14),top+d(49),12,0xFFEAF4FA,false);
                      rounded(c,x+d(12),top+d(61),x+d(212),top+d(108),d(9),0xFF0C151D);
                      text(c,"Kills: "+kills,x+d(22),top+d(90),18,0xFFFFFFFF,true);
                      rounded(c,x+d(12),top+d(118),x+d(66),top+d(151),d(8),0xFF24516B);
                      rounded(c,x+d(74),top+d(118),x+d(136),top+d(151),d(8),0xFF24516B);
                      rounded(c,x+d(144),top+d(118),x+d(212),top+d(151),d(8),0xFF583C42);
                      text(c,"-1",x+d(38),top+d(140),14,0xFFFFFFFF,true);
                      text(c,"+1",x+d(97),top+d(140),14,0xFFFFFFFF,true);
                      text(c,"RESET",x+d(158),top+d(140),11,0xFFFFFFFF,true);
                  }
                  @Override public boolean onTouchEvent(MotionEvent e){
                      float x=e.getX(),y=e.getY(),ox=d(bx),oy=by;
                      if(e.getAction()==MotionEvent.ACTION_DOWN){
                          downX=x;downY=y;startX=bx;startY=by;
                          drag=x>=ox&&x<=ox+d(112)&&y>=oy&&y<=oy+d(42);
                          return true;
                      }
                      if(e.getAction()==MotionEvent.ACTION_MOVE){
                          if(drag){bx=Math.max(0,Math.min((getWidth()-d(112))/density,startX+(x-downX)/density));
                              by=Math.max(0,Math.min(getHeight()-d(42),startY+(y-downY)));invalidate();}
                          return true;
                      }
                      if(e.getAction()==MotionEvent.ACTION_UP){
                          if(drag && Math.abs(x-downX)+Math.abs(y-downY)<d(12)){menu=!menu;}
                          else if(menu){
                              float top=oy+d(52);
                              if(y>=top+d(118)&&y<=top+d(151)){
                                  if(x>=ox+d(12)&&x<ox+d(70))kills=Math.max(0,kills-1);
                                  else if(x>=ox+d(74)&&x<ox+d(140))kills++;
                                  else if(x>=ox+d(144)&&x<=ox+d(212))kills=0;
                                  prefs.edit().putInt("local_kill_display",kills).apply();
                              }
                          }
                          drag=false;invalidate();return true;
                      }
                      return true;
                  }
              }
          }
          JAVA
          javac --release 8 -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d work/classes work/java/com/lac/overlay/LacOverlayApplication.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 21 --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output work/dex work/classes/com/lac/overlay/LacOverlayApplication.class
          apktool b work/decoded -o work/rebuilt.apk
          max=1
          while unzip -Z1 work/rebuilt.apk | grep -qE "^classes${max}\.dex$"; do max=$((max+1)); done
          cp work/dex/classes.dex "work/classes${max}.dex"
          (cd work && zip -q rebuilt.apk "classes${max}.dex")
          unzip -tq work/rebuilt.apk
          mkdir -p artifact
          cp work/rebuilt.apk artifact/LAC-1.9.8-Floating-Menu-unsigned.apk

      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          keytool -genkeypair -v -keystore work/lac-overlay.keystore \
            -storepass changeit -keypass changeit -alias lac-overlay \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LAC Local Overlay, OU=Build, O=Community, L=NA, S=NA, C=US"
          zipalign -f -p 4 artifact/LAC-1.9.8-Floating-Menu-unsigned.apk work/aligned.apk
          apksigner sign --ks work/lac-overlay.keystore --ks-pass pass:changeit \
            --key-pass pass:changeit --out artifact/LAC-1.9.8-Floating-Menu.apk work/aligned.apk
          apksigner verify --verbose --print-certs artifact/LAC-1.9.8-Floating-Menu.apk
          aapt dump badging artifact/LAC-1.9.8-Floating-Menu.apk | head -n 3
          unzip -tq artifact/LAC-1.9.8-Floating-Menu.apk
          sha256sum artifact/LAC-1.9.8-Floating-Menu.apk > artifact/SHA256SUMS.txt
          cat > artifact/BUILD-NOTES.txt <<'EOF'
          LAC 1.9.8 (versionCode 62) APK with an in-app floating Canvas overlay.
          The kill counter is LOCAL DISPLAY ONLY and does not change game/server statistics.
          This is an Android Canvas overlay, not native Dear ImGui.
          APK is signed with a newly generated test key; it cannot update an install signed by the original publisher.
          Original OBB/data is not bundled.
          EOF

      - name: Upload signed APK only
        uses: actions/upload-artifact@v4
        with:
          name: LAC-1.9.8-Floating-Menu-Signed-APK
          path: |
            artifact/LAC-1.9.8-Floating-Menu.apk
            artifact/SHA256SUMS.txt
            artifact/BUILD-NOTES.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

# Trigger build from the workflow-file commit.
