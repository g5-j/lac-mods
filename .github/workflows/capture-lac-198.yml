name: Capture LAC 1.9.8 package for mod development

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/capture-lac-198.yml"

permissions:
  contents: read

concurrency:
  group: lac-198-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download official XAPK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input package/native package/metadata
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36' \
            'https://d.apkpure.com/b/XAPK/com.MA.LAC?version=latest' \
            --output input/lac-latest.xapk
          test -s input/lac-latest.xapk
          sha256sum input/lac-latest.xapk | tee package/metadata/xapk-sha256.txt
          unzip -t input/lac-latest.xapk

      - name: Extract and verify exact target version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/unpacked
          unzip -q input/lac-latest.xapk -d input/unpacked
          python - <<'PY'
          import json, pathlib, shutil, sys
          root=pathlib.Path("input/unpacked")
          manifests=list(root.rglob("manifest.json"))
          if not manifests:
              raise SystemExit("XAPK manifest.json missing")
          data=json.loads(manifests[0].read_text(errors="replace"))
          version=str(data.get("version_name") or data.get("versionName") or "")
          code=str(data.get("version_code") or data.get("versionCode") or "")
          summary={"package":"com.MA.LAC","version_name":version,"version_code":code}
          pathlib.Path("package/metadata/package.json").write_text(json.dumps(summary,indent=2))
          if version != "1.9.8" or code != "62":
              raise SystemExit(f"Wrong package version: {summary}; expected 1.9.8 (62)")
          apks=list(root.rglob("*.apk"))
          obbs=list(root.rglob("*.obb"))
          if len(apks)!=1 or len(obbs)!=1:
              raise SystemExit(f"Expected exactly one APK and one OBB; found {len(apks)} APK and {len(obbs)} OBB")
          shutil.copy2(apks[0],"package/LAC-1.9.8.apk")
          shutil.copy2(obbs[0],"package/LAC-1.9.8.obb")
          print(summary)
          PY

      - name: Extract native libraries and collect ABI metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/apk
          unzip -q package/LAC-1.9.8.apk -d input/apk
          find input/apk/lib -type f -name '*.so' -print0 | while IFS= read -r -d '' lib; do
            rel="${lib#input/apk/lib/}"
            mkdir -p "package/native/$(dirname "$rel")"
            cp "$lib" "package/native/$rel"
          done
          {
            echo "## APK native libraries"
            find input/apk/lib -type f -name '*.so' -printf '%P\t%s bytes\n' | sort
            echo
            echo "## IL2CPP library"
            find input/apk/lib -type f -name 'libil2cpp.so' -exec file {} \; -exec readelf -h {} \; 2>/dev/null || true
            echo
            echo "## Unity metadata files"
            find input/apk -type f \( -name 'global-metadata.dat' -o -name 'libunity.so' -o -name 'libil2cpp.so' \) -printf '%P\t%s bytes\n' | sort
          } > package/metadata/native-inventory.txt
          test -s package/metadata/native-inventory.txt

      - name: Upload exact APK, OBB and native inputs
        uses: actions/upload-artifact@v4
        with:
          name: LAC-1.9.8-Development-Inputs-v62
          path: |
            package/LAC-1.9.8.apk
            package/LAC-1.9.8.obb
            package/native/
            package/metadata/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
