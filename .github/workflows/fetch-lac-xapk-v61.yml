name: Fetch LAC XAPK v61

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-lac-xapk-v61.yml"

permissions:
  contents: read

jobs:
  fetch-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare workspace
        shell: bash
        run: |
          mkdir -p work/extracted artifact/extracted

      - name: Download XAPK from APKPure
        shell: bash
        run: |
          set -euo pipefail
          URL='https://d.apkpure.com/b/XAPK/com.MA.LAC?versionCode=61'
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 1200 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36' \
            "$URL" --output work/LAC-v61.xapk
          test -s work/LAC-v61.xapk
          file work/LAC-v61.xapk
          unzip -t work/LAC-v61.xapk

      - name: Extract package and inspect contents
        shell: bash
        run: |
          set -euo pipefail
          unzip -q work/LAC-v61.xapk -d work/extracted
          cp -a work/extracted/. artifact/extracted/
          find work/extracted -type f -printf '%P\t%s bytes\n' | sort > artifact/file-list.txt
          {
            echo "Package: com.MA.LAC"
            echo "Requested versionCode: 61"
            echo "Downloaded at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "Files:"
            cat artifact/file-list.txt
          } > artifact/inspection-report.txt
          find work/extracted -type f -iname '*.apk' -print0 | while IFS= read -r -d '' apk; do
            if unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libil2cpp.so'; then
              unzip -p "$apk" 'lib/arm64-v8a/libil2cpp.so' > artifact/libil2cpp.so
              break
            fi
          done
          if [ -f artifact/libil2cpp.so ]; then
            echo "Extracted: libil2cpp.so (arm64-v8a)" >> artifact/inspection-report.txt
          else
            echo "libil2cpp.so (arm64-v8a) not found inside APK files." >> artifact/inspection-report.txt
          fi
          (cd artifact && sha256sum LAC-v61.xapk extracted/* 2>/dev/null > SHA256SUMS || true)

      - name: Upload downloaded package and extracted files
        uses: actions/upload-artifact@v4
        with:
          name: LAC-v61-XAPK-and-extracted-files
          path: artifact/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
