name: Analyze LAC 1.9.8 IL2CPP

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/analyze-lac-il2cpp-v198.yml"

permissions:
  contents: read

concurrency:
  group: lac-v198-il2cpp
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Download and extract LAC 1.9.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/apk work/dumper work/output artifact
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36' \
            'https://d.apkpure.com/b/XAPK/com.MA.LAC?version=latest' -o work/LAC-1.9.8.xapk
          unzip -q work/LAC-1.9.8.xapk -d work/apk
          python3 - <<'PY'
          import json, pathlib
          p=next(pathlib.Path("work/apk").rglob("manifest.json"))
          m=json.loads(p.read_text(errors="replace"))
          v=str(m.get("version_name") or m.get("versionName") or "")
          c=str(m.get("version_code") or m.get("versionCode") or "")
          if (v,c)!=("1.9.8","62"):
              raise SystemExit(f"Wrong game version: {v} ({c})")
          print(f"Verified com.MA.LAC {v} build {c}")
          PY
          APK="$(find work/apk -maxdepth 2 -name '*.apk' -print -quit)"
          test -s "$APK"
          unzip -p "$APK" assets/bin/Data/Managed/Metadata/global-metadata.dat > work/global-metadata.dat
          unzip -p "$APK" lib/arm64-v8a/libil2cpp.so > work/libil2cpp.so
          test -s work/global-metadata.dat
          test -s work/libil2cpp.so
          file work/global-metadata.dat work/libil2cpp.so
          sha256sum work/global-metadata.dat work/libil2cpp.so > artifact/input-sha256.txt

      - name: Download Il2CppDumper
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip' \
            -o work/Il2CppDumper.zip
          unzip -q work/Il2CppDumper.zip -d work/dumper
          test -f work/dumper/Il2CppDumper.dll

      - name: Dump IL2CPP metadata and collect relevant symbols
        shell: bash
        run: |
          set -euo pipefail
          script -q -c 'dotnet work/dumper/Il2CppDumper.dll work/libil2cpp.so work/global-metadata.dat work/output' /dev/null <<< ''
          test -s work/output/dump.cs
          cp work/output/dump.cs artifact/
          cp work/output/stringliteral.json artifact/ 2>/dev/null || true
          cp work/output/il2cpp.h artifact/ 2>/dev/null || true
          {
            echo "LAC package: com.MA.LAC"
            echo "Version: 1.9.8"
            echo "Version code: 62"
            echo "Metadata version: 31 (expected)"
            echo "ABI: arm64-v8a"
            echo "Il2CppDumper: v6.7.46"
            echo
            echo "## Admin / role / permissions / shooting / chat / UI symbols"
            grep -Ein -m 5000 'admin|permission|userstate|serveruser|rank|host|shoot|can.?shoot|fire|weapon|chat|command|overlay|menu|canvas|button|input' artifact/dump.cs || true
          } > artifact/target-symbols.txt
          {
            echo "## Dump files"
            du -h artifact/* || true
            echo
            echo "## Relevant literal strings"
            grep -Ein -m 1000 'admin|can.?shoot|shoot|weapon|/give|permission|host|rank|command' artifact/stringliteral.json 2>/dev/null || true
          } > artifact/analysis-report.txt
          test -s artifact/target-symbols.txt

      - name: Validate metadata and package identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class PlayerControl' artifact/dump.cs
          grep -q 'class PlayerKillFeed' artifact/dump.cs
          {
            echo
            echo "Validation: PlayerControl and PlayerKillFeed declarations found."
            echo "This artifact is analysis-only; it does not patch gameplay or bypass server-side permissions."
          } >> artifact/analysis-report.txt

      - name: Upload IL2CPP analysis
        uses: actions/upload-artifact@v4
        with:
          name: LAC-1.9.8-IL2CPP-Analysis-v62
          path: artifact/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
