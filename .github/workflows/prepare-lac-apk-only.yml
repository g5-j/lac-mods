name: Prepare LAC 1.9.8 APK-only ImGui integration
# Output is a single APK; the source XAPK is only an extraction container.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prepare-lac-apk-only.yml"

permissions:
  contents: read

concurrency:
  group: lac-apk-only
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download package and extract APK only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/xapk work/apk artifact/reports
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36' \
            'https://d.apkpure.com/b/XAPK/com.MA.LAC?version=latest' \
            --output work/lac-source.xapk
          unzip -q work/lac-source.xapk -d work/xapk
          python3 - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path("work/xapk")
          manifests=list(root.rglob("manifest.json"))
          if not manifests:
              raise SystemExit("XAPK manifest.json missing")
          m=json.loads(manifests[0].read_text(errors="replace"))
          version=str(m.get("version_name") or m.get("versionName") or "")
          code=str(m.get("version_code") or m.get("versionCode") or "")
          if (version,code)!=("1.9.8","62"):
              raise SystemExit(f"Expected LAC 1.9.8 build 62, found {version} ({code})")
          apks=list(root.rglob("*.apk"))
          if len(apks)!=1:
              raise SystemExit(f"Expected one APK, found {len(apks)}")
          shutil.copy2(apks[0],"artifact/LAC-1.9.8-original.apk")
          pathlib.Path("artifact/reports/package.json").write_text(json.dumps({
            "package":"com.MA.LAC","version_name":version,"version_code":code,
            "input":"APK only","OBB":"not included in output"
          },indent=2))
          PY
          sha256sum artifact/LAC-1.9.8-original.apk > artifact/reports/apk-sha256.txt
          unzip -t artifact/LAC-1.9.8-original.apk

      - name: Inspect Android manifest and native ABI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y aapt apktool
          aapt dump badging artifact/LAC-1.9.8-original.apk > artifact/reports/badging.txt
          aapt dump xmltree artifact/LAC-1.9.8-original.apk AndroidManifest.xml > artifact/reports/manifest-tree.txt
          mkdir -p work/decoded
          apktool d -f -s artifact/LAC-1.9.8-original.apk -o work/decoded
          cp work/decoded/AndroidManifest.xml artifact/reports/AndroidManifest-decoded.xml
          {
            echo "## Native libraries in APK"
            unzip -Z1 artifact/LAC-1.9.8-original.apk | grep -E '^lib/[^/]+/[^/]+\.so$' | sort || true
            echo
            echo "## Unity / IL2CPP files"
            unzip -Z1 artifact/LAC-1.9.8-original.apk | grep -Ei 'libil2cpp\.so|libunity\.so|global-metadata\.dat|UnityPlayer' || true
            echo
            echo "## Android activities and services"
            grep -nE 'activity|service|UnityPlayerActivity|GameActivity|application' artifact/reports/manifest-tree.txt || true
          } > artifact/reports/native-and-entrypoints.txt
          test -s artifact/reports/native-and-entrypoints.txt

      - name: Download JADX and inspect Java entry points
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' \
            -o work/jadx.zip
          unzip -q work/jadx.zip -d work/jadx
          mkdir -p work/java
          set +e
          work/jadx/bin/jadx --no-res --show-bad-code --threads-count 2 -d work/java artifact/LAC-1.9.8-original.apk > artifact/reports/jadx.log 2>&1
          jadx_status=$?
          set -e
          {
            echo "JADX exit status: $jadx_status (non-zero can mean partial decompilation)"
            echo
            echo "## Unity activity / native loading / rendering entry points"
            grep -RInE -m 1500 'UnityPlayerActivity|UnityPlayer|System\\.loadLibrary|onCreate\\(|onResume\\(|onPause\\(|eglSwapBuffers|GLSurfaceView|SurfaceView' work/java/sources || true
            echo
            echo "## Decompiled source file count"
            find work/java/sources -type f -name '*.java' 2>/dev/null | wc -l
          } > artifact/reports/java-entrypoints.txt
          test -s artifact/reports/java-entrypoints.txt
          test -d work/java/sources

      - name: Upload APK-only integration inputs
        uses: actions/upload-artifact@v4
        with:
          name: LAC-1.9.8-APK-Only-Integration-Input
          path: artifact/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
