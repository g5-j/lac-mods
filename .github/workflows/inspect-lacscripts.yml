name: Inspect LACScripts packages
on:
  push:
    paths:
      - ".github/workflows/inspect-lacscripts.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect both plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/phone_messenger artifact/admin_give
          unzip -q phone_messenger.lacscripts -d artifact/phone_messenger
          unzip -q admin-give.lacscripts -d artifact/admin_give
          for d in artifact/phone_messenger artifact/admin_give; do
            test -s "$d/manifest.json"
            python3 -m json.tool "$d/manifest.json" > "$d/manifest.pretty.json"
            find "$d" -type f -printf '%P\t%s bytes\n' | sort > "$d/files.txt"
          done
          sha256sum phone_messenger.lacscripts admin-give.lacscripts > artifact/source-sha256.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq jadx
          mkdir -p artifact/phone_messenger/java artifact/admin_give/java
          jadx --no-res --show-bad-code -d artifact/phone_messenger/java artifact/phone_messenger/classes.dex || true
          jadx --no-res --show-bad-code -d artifact/admin_give/java artifact/admin_give/classes.dex || true
          file artifact/phone_messenger/lib/arm64-v8a/*.so artifact/admin_give/lib/arm64-v8a/*.so > artifact/native-file-types.txt
          readelf -Ws artifact/phone_messenger/lib/arm64-v8a/*.so > artifact/phone_messenger/native-symbols.txt
          readelf -Ws artifact/admin_give/lib/arm64-v8a/*.so > artifact/admin_give/native-symbols.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lacscripts-inspection
          path: artifact/
          if-no-files-found: error
          retention-days: 7
